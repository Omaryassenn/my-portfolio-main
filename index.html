<!DOCTYPE html>
<html lang="en" class="dark-mode">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Omar Yassen</title>
    <meta name="title" content="Omar Yassen - UI/UX Designer & Frontend Developer">
    <meta name="description" content="I craft seamless user experiences and build responsive, accessible, and performant web applications.">
    <meta name="keywords" content="Omar Yassen, UI/UX Designer, Frontend Developer, Portfolio, Web Design, Responsive Design, Accessibility, Performance, Web Development">
    <meta name="author" content="Omar Yassen">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://omaryassen.vercel.app/">
    <meta property="og:title" content="Omar Yassen - UI/UX Designer & Frontend Developer">
    <meta property="og:description" content="I craft seamless user experiences and build responsive, accessible, and performant web applications.">
    <!-- Dimensions must match the file byte for byte: scrapers reserve the card's
         space from these before the image arrives, so a wrong ratio gets the
         artwork letterboxed or cropped. cover.png is 1024x576 (16:9), not the
         1200x630 that was declared here. The type is stated explicitly because
         the file is JPEG data under a .png name. -->
    <meta property="og:image" content="https://omaryassen.vercel.app/cover.png">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="576">
    <meta property="og:image:alt" content="Crafted by Omar — Omar Yassen's portfolio">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://omaryassen.vercel.app/">
    <meta property="twitter:title" content="Omar Yassen - UI/UX Designer & Frontend Developer">
    <meta property="twitter:description" content="I craft seamless user experiences and build responsive, accessible, and performant web applications.">
    <meta property="twitter:image" content="https://omaryassen.vercel.app/cover.png">
    <meta property="twitter:image:alt" content="Crafted by Omar — Omar Yassen's portfolio">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
